<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="assets/apionix-phoenix-favicon.png?v=2" />
  <title>Apionix｜IoT 裝置檢測</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="embedded-system-page">
  <header class="site-header nav-animate">
    <div class="container nav-wrap">
      <a class="brand brand-image-only nav-item-animate" href="index.html#home" aria-label="Apionix 首頁">
        <img class="brand-logo-img" src="assets/apionix-wordmark.png" alt="Apionix" />
      </a>

      <nav class="nav-links nav-item-animate">
        <a href="index.html#home">首頁</a>
        <a href="platform.html">平台介紹</a>
        <div class="nav-dropdown">
          <a class="nav-dropdown-trigger" href="index.html#services" aria-haspopup="true">核心服務 <span aria-hidden="true">⌄</span></a>
          <div class="nav-dropdown-menu" aria-label="核心服務選單">
            <a data-apk-frontend href="system.html?service=apk">APK 安全分析</a>
            <a data-iot-system href="iot-system.html">IoT 裝置檢測</a>
          </div>
        </div>
        <a href="workflow.html">使用流程</a>
        <a href="contact.html">聯絡我們</a>
      </nav>

      <div class="nav-actions nav-item-animate">
        <a class="btn btn-line" href="platform.html">了解平台</a>
        <a class="btn btn-blue" href="index.html#services">立即開始</a>
      </div>
    </div>
  </header>

  <main class="embedded-system-main" aria-label="IoT 裝置管理系統">
    <iframe
      class="embedded-system-frame"
      src="http://127.0.0.1:5180/"
      title="IoT 韌體與裝置管理 Dashboard"
      allow="clipboard-read; clipboard-write"
    ></iframe>
  </main>

  <dialog class="guest-exit-dialog" id="guest-exit-dialog" aria-labelledby="guest-exit-title">
    <div class="guest-exit-icon" aria-hidden="true">!</div>
    <p class="eyebrow">GUEST SESSION</p>
    <h2 id="guest-exit-title">尚未登入，確定要離開嗎？</h2>
    <p>如果沒有先登入保存，本次使用與操作記錄可能會消失，之後將無法恢復。</p>
    <div class="guest-exit-actions">
      <button class="btn btn-line" id="guest-stay" type="button">繼續使用</button>
      <button class="btn btn-blue" id="guest-login" type="button">登入並保存</button>
      <button class="guest-leave-link" id="guest-leave" type="button">不保存並離開</button>
    </div>
  </dialog>

  <script src="config.js"></script>
  <script src="script.js"></script>
  <script>
    (() => {
      const dialog = document.querySelector("#guest-exit-dialog");
      const frame = document.querySelector(".embedded-system-frame");
      let pendingDestination = null;
      let confirmedLeave = false;
      let isGuestSession = true;

      window.addEventListener("message", (event) => {
        if (event.origin !== "http://127.0.0.1:5180") return;
        if (event.data?.type === "apionix:session-state") {
          isGuestSession = event.data.guest;
        }
      });

      document.querySelectorAll(".site-header a").forEach((link) => {
        link.addEventListener("click", (event) => {
          const destination = link.href;
          if (!destination || destination === window.location.href) return;
          if (!isGuestSession) return;
          event.preventDefault();
          pendingDestination = destination;
          dialog.showModal();
        });
      });

      document.querySelector("#guest-stay").addEventListener("click", () => {
        pendingDestination = null;
        dialog.close();
      });

      document.querySelector("#guest-login").addEventListener("click", () => {
        pendingDestination = null;
        dialog.close();
        frame.contentWindow.postMessage("apionix:login-save", "http://127.0.0.1:5180");
      });

      document.querySelector("#guest-leave").addEventListener("click", () => {
        confirmedLeave = true;
        window.location.href = pendingDestination || "index.html";
      });

      window.addEventListener("beforeunload", (event) => {
        if (confirmedLeave || !isGuestSession) return;
        event.preventDefault();
        event.returnValue = "";
      });
    })();
  </script>
</body>
</html>
